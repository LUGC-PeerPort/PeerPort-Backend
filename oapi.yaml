openapi: 3.1.1
info:
  title: PeerPort Backend API
  description: PeerPort is an independent Learning Management System (LMS) designed by students for students.
  version: 0.0.1
  contact:
    name: PeerPort Team
    email: aidenlortie@aol.com
    url: https://github.com/orgs/LUGC-PeerPort/
servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /users:
    get:
      tags:
        - Users
      summary: Retrieve a list of users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWithId'

    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPost'
      responses:
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: Conflict - Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
                
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Retrieve a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGet'
        '404':
          description: User not found or invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Users
      summary: Update a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBasic'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Users
      summary: Delete a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /users/{userId}/courses:
    get:
      tags:
        - Users
        - Courses
      summary: Retrieve classes for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of classes for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseWithEnrolledDate'
        '400':
          description: Bad request - Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User not found | Classes not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /users/{userId}/courses/{courseId}:
    get:
      tags:
        - Users
        - Courses
      summary: Retrieve a specific course for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single course for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseWithEnrolledDate'
        '400':
          description: Bad request - Invalid user ID or course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User or course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /courses:
    get:
      tags:
        - Courses
      summary: Retrieve a list of classes
      responses:
        '200':
          description: A list of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseBasic'
    post:
      tags:
        - Courses
      summary: Create a new course for an instructor and adds them to that course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePost'
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasic'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User(instructor) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}:
    get:
      tags:
        - Courses
      summary: Retrieve a specific course by ID
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasic'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Courses
      summary: Update a specific course by ID
      parameters:
        - name: courseId
          in: path
          required: true
          description: The ID of the course to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBasic'
      responses:
        '200':
          description: Course updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasic'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Courses
      summary: Delete a specific course by ID
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Course deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Course deleted
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}/enroll/{userId}:
    post:
      tags:
        - Courses
        - Users
      summary: Enroll a user in a specific course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: User enrolled in course successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User enrolled in course
        '400':
          description: Bad request - Invalid user ID or course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User or course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: Conflict - User already enrolled in the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}/assignments:
    get:
      tags:
        - Courses
        - Assignments
      summary: Retrieve assignments for a specific course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of assignments for the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentBasicWithAssignmentId'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /assignments:
    get:
      tags:
        - Assignments
      summary: Retrieve a list of assignments
      responses:
        '200':
          description: A list of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentBasicWithId'
    post:
      tags:
        - Assignments
      summary: Create a new assignment for a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentBasicWithCourseId'
      responses:
        '201':
          description: Assignment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBasicWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /assignments/{assignmentId}:
    get:
      tags:
        - Assignments
      summary: Retrieve a specific assignment by ID
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBasicWithId'
        '400':
          description: Bad request - Invalid assignment ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Assignments
      summary: Update a specific assignment by ID
      parameters:
        - name: assignmentId
          in: path
          required: true
          description: The ID of the assignment to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentBasic'
      responses:
        '200':
          description: Assignment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBasicWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Assignments
      summary: Delete a specific assignment by ID
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Assignment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assignment deleted
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid assignment ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /assignments/{assignmentId}/submissions:
    get:
      tags:
        - Assignments
        - Submissions
      summary: Retrieve submissions for a specific assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of submissions for the assignment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionWithIds'
        '400':
          description: Bad request - Invalid assignment ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    post:
      tags:
        - Assignments
        - Submissions
      summary: Create a new submission for a specific assignment by a user
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionPost'
      responses:
        '201':
          description: Submission created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionWithIds'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  
  /submissions:
    get:
      tags:
        - Submissions
      summary: Retrieve a list of submissions
      responses:
        '200':
          description: A list of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionWithIds'
  /submissions/{submissionId}:
    get:
      tags:
        - Submissions
      summary: Retrieve a specific submission by ID
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionWithIds'
        '400':
          description: Bad request - Invalid submission ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Submissions
      summary: Delete a specific submission by ID
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Submission deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Submission deleted
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid submission ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'



components:
  schemas:
    UserBasic:
      type: object
      required:
        - name
        - email
        - idNumber
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        profilePictureUrl:
          type: string
          format: uri
          description: URL to the user's profile picture
        idNumber:
          type: string
          description: Institution-specific ID number
    UserWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user
    UserGet:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserWithId'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user
            role:
              $ref: '#/components/schemas/RoleBasic'
            classes:
              type: array
              items:
                $ref: '#/components/schemas/CourseWithEnrolledDate'
    UserPost:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          required:
            - password
          properties:
            password:
              type: string
              format: password
              description: User's password (hashed in the database)
      
    RoleBasic:
      type: object
      properties:
        name:
          type: string
          description: Name of the role (e.g., Student, Instructor, Admin)
    RoleWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/RoleBasic'
        - type: object
          properties:
            roleId:
              type: string
              format: uuid
              description: Unique Role identifier

    CourseBasic:
      required:
        - name
        - courseCode
        - isOpen
        - startDate
      type: object
      properties:
        classId:
          type: string
          format: uuid
          description: Unique Course Identifier
        name:
          type: string
          description: Name of the course (e.g., Math 101)
        courseCode:
          type: string
          description: Course Code (e.g., MATH101)
        isOpen:
          type: boolean
          description: False value if the course is archived / not active
        description:
          type: string
          description: Description of the course
        startDate:
          type: string
          format: date
          description: Start date of the course
        endDate:
          type: string
          format: date
          description: End date of the course
    CoursePost:
      type: object
      required:
        - name
        - courseCode
        - userId
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: ID of the instructor creating the course
    CourseWithEnrolledDate:
      type: object
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            enrolledOn:
              type: string
              format: date
              description: Date when the User started the course
    CourseWithUsers:
      type: object
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserBasic'

    UserToCourses:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user-course relationship
        enrolledOn:
          type: string
          format: date
          description: Date when the user enrolled in the course
        user:
          $ref: '#/components/schemas/UserBasic'
        classEntity:
          $ref: '#/components/schemas/CourseBasic'

    AssignmentBasic:
      type: object
      required:
        - name
        - description
        - dueDate
      properties:
        name:
          type: string
          description: Name of the assignment
        description:
          type: string
          description: Description of the assignment
        dueDate:
          type: string
          format: date-time
          description: Due date of the assignment
    AssignmentBasicWithCourseId:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssignmentBasic'
        - type: object
          properties:
            courseId:
              type: string
              format: uuid
              description: Unique identifier for the course
    AssignmentBasicWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssignmentBasicWithCourseId'
        - type: object
          properties:
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment
    AssignmentBasicWithAssignmentId:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssignmentBasic'
        - type: object
          properties:
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment

    SubmissionBasic:
      type: object
      required:
        - comment
        - timeSubmitted
      properties:
        comment:
          type: string
          description: Comment or feedback for the submission
        timeSubmitted:
          type: string
          format: date-time
          description: Timestamp of when the submission was made
    SubmissionWithIds:
      type: object
      allOf:
        - $ref: '#/components/schemas/SubmissionBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user who made the submission
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment
            submissionId:
              type: string
              format: uuid
              description: Unique identifier for the submission
    SubmissionPost:
      type: object
      allOf:
        - $ref: '#/components/schemas/SubmissionBasic'
        - type: object
          required:
            - userId
          properties:
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user making the submission

    BasicError:
      type: object
      properties:
        message:
          type: string
          description: Error message detailing what went wrong