openapi: 3.1.1
info:
  title: PeerPort Backend API
  description: PeerPort is an independent Learning Management System (LMS) designed by students for students.
  version: 0.0.1
  contact:
    name: PeerPort Team
    email: aidenlortie@aol.com
    url: https://github.com/orgs/LUGC-PeerPort/
servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /users:
    get:
      tags:
        - Users
      summary: Retrieve a list of users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWithId'

    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPost'
      responses:
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: Conflict - Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
                
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Retrieve a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGet'
        '404':
          description: User not found or invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Users
      summary: Update a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBasic'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Users
      summary: Delete a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /users/{userId}/courses:
    get:
      tags:
        - Users
        - Courses
      summary: Retrieve classes for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of classes for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseWithEnrolledDate'
        '400':
          description: Bad request - Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User not found | Classes not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /users/{userId}/courses/{courseId}:
    get:
      tags:
        - Users
        - Courses
      summary: Retrieve a specific course for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single course for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasicWithEnrolledDate'
        '400':
          description: Bad request - Invalid user ID or course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User or course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /courses:
    get:
      tags:
        - Courses
      summary: Retrieve a list of classes
      responses:
        '200':
          description: A list of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseBasic'
    post:
      tags:
        - Courses
      summary: Create a new course for an instructor and adds them to that course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePost'
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasic'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User(instructor) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}:
    get:
      tags:
        - Courses
      summary: Retrieve a specific course by ID
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasic'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'



components:
  schemas:
    UserBasic:
      type: object
      required:
        - name
        - email
        - idNumber
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        profilePictureUrl:
          type: string
          format: uri
          description: URL to the user's profile picture
        idNumber:
          type: string
          description: Institution-specific ID number
    UserWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user
    UserGet:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserWithId'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user
            role:
              type: object
              nullable: true
              $ref: '#/components/schemas/RoleBasic'
            classes:
              type: array
              items:
                $ref: '#/components/schemas/CourseWithEnrolledDate'
    UserPost:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          required:
            - password
          properties:
            password:
              type: string
              format: password
              description: User's password (hashed in the database)
      
    RoleBasic:
      type: object
      properties:
        name:
          type: string
          description: Name of the role (e.g., Student, Instructor, Admin)
    RoleWithId:
      type: object
      allof:
        - $ref: '#/components/schemas/RoleBasic'
        - type: object
          properties:
            roleId:
              type: string
              format: uuid
              description: Unique Role identifier

    CourseBasic:
      required:
        - name
        - courseCode
        - isOpen
        - startDate
      type: object
      properties:
        classId:
          type: string
          format: uuid
          description: Unique Course Identifier
        name:
          type: string
          description: Name of the course (e.g., Math 101)
        courseCode:
          type: string
          description: Course Code (e.g., MATH101)
        isOpen:
          type: boolean
          description: False value if the course is archived / not active
        description:
          type: string
          description: Description of the course
        startDate:
          type: string
          format: date
          description: Start date of the course
        endDate:
          type: string
          format: date
          description: End date of the course
    CoursePost:
      type: object
      required:
        - name
        - courseCode
        - userId
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: ID of the instructor creating the course

    CourseWithEnrolledDate:
      type: object
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            enrolledOn:
              type: string
              format: date
              description: Date when the User started the course

    CourseWithUsers:
      type: object
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserBasic'

    UserToCourses:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user-course relationship
        enrolledOn:
          type: string
          format: date
          description: Date when the user enrolled in the course
        user:
          type: object
          $ref: '#/components/schemas/User'
        classEntity:
          type: object
          $ref: '#/components/schemas/Course'
  
    BasicError:
      type: object
      properties:
        message:
          type: string
          description: Error message detailing what went wrong