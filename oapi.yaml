openapi: 3.1.1
info:
  title: PeerPort Backend API
  description: PeerPort is an independent Learning Management System (LMS) designed by students for students.
  version: 0.0.1
  contact:
    name: PeerPort Team
    email: aidenlortie@aol.com
    url: https://github.com/orgs/LUGC-PeerPort/
servers:
  - url: http://localhost:3000
    description: Local server

paths:
  /auth/currentUser:
    get:
      tags:
        - Authentication
      summary: Retrieve the currently authenticated user
      responses:
        '200':
          description: The currently authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserId'
        '401':
          description: Unauthorized - No valid authentication token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /users:
    get:
      tags:
        - Users
      summary: Retrieve a list of users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWithId'

    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPost'
      responses:
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: Conflict - Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Retrieve a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGet'
        '404':
          description: User not found or invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Users
      summary: Update a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBasic'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Users
      summary: Delete a specific user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /users/{userId}/courses:
    get:
      tags:
        - Users
        - Courses
      summary: Retrieve courses for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of courses for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseWithEnrolledDate'
        '400':
          description: Bad request - Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User not found | Courses not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /users/{userId}/courses/{courseId}:
    get:
      tags:
        - Users
        - Courses
      summary: Retrieve a specific course for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single course for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseWithEnrolledDate'
        '400':
          description: Bad request - Invalid user ID or course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User or course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /courses:
    get:
      tags:
        - Courses
      summary: Retrieve a list of courses
      responses:
        '200':
          description: A list of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseBasicWithId'
    post:
      tags:
        - Courses
      summary: Create a new course for an instructor and adds them to that course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePost'
            examples:
              payload:
                $ref: '#/components/examples/CoursePostExample'
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasicWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User(instructor) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}:
    get:
      tags:
        - Courses
      summary: Retrieve a specific course by ID
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasicWithId'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Courses
      summary: Update a specific course by ID
      parameters:
        - name: courseId
          in: path
          required: true
          description: The ID of the course to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBasic'
            examples:
              payload:
                $ref: '#/components/examples/CourseUpdateExample'
      responses:
        '200':
          description: Course updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBasicWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}/enroll/{userId}:
    post:
      tags:
        - Courses
        - Users
      summary: Enroll a user in a specific course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: User enrolled in course successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User enrolled in course
        '400':
          description: Bad request - Invalid user ID or course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: User or course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: Conflict - User already enrolled in the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}/assignments:
    get:
      tags:
        - Courses
        - Assignments
      summary: Retrieve assignments for a specific course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of assignments for the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentBasicWithAssignmentId'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /courses/{courseId}/content:
    get:
      tags:
        - Courses
        - Content
      summary: Retrieve content for a specific course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of content for the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentGet'
        '400':
          description: Bad request - Invalid course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /content:
    get:
      tags:
        - Content
      summary: Retrieve a list of content items
      responses:
        '200':
          description: A list of content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentGet'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /content/{courseId}:
    post:
      tags:
        - Content
      summary: Create a new content item for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPost'
            examples:
              payload:
                $ref: '#/components/examples/ContentPostExample'
      responses:
        '201':
          description: Content created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGet'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /content/{contentId}:
    get:
      tags:
        - Content
      summary: Retrieve a specific content item by ID
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single content item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGet'
        '400':
          description: Bad request - Invalid content ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Content
      summary: Update a specific content item by ID
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPatch'
            examples:
              payload:
                $ref: '#/components/examples/ContentPostExample'
      responses:
        '200':
          description: Content updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGet'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Content
      summary: Delete a specific content item by ID
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Content deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Content deleted
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid content ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /content/sub/{parentId}:
    post:
      tags:
        - Content
      summary: Create a sub-content item under a parent content item
      parameters:
        - name: parentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPost'
            examples:
              payload:
                $ref: '#/components/examples/ContentPostExample'
      responses:
        '201':
          description: Sub-content created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentGet'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Parent content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /assignments:
    get:
      tags:
        - Assignments
      summary: Retrieve a list of assignments
      responses:
        '200':
          description: A list of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentBasicWithId'
    post:
      tags:
        - Assignments
      summary: Create a new assignment for a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentBasicWithCourseId'
            examples:
              payload:
                $ref: '#/components/examples/AssignmentPostExample'
      responses:
        '201':
          description: Assignment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBasicWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /assignments/{assignmentId}:
    get:
      tags:
        - Assignments
      summary: Retrieve a specific assignment by ID
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBasicWithId'
        '400':
          description: Bad request - Invalid assignment ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Assignments
      summary: Update a specific assignment by ID
      parameters:
        - name: assignmentId
          in: path
          required: true
          description: The ID of the assignment to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentBasic'
            examples: 
              payload:
                $ref: '#/components/examples/AssignmentUpdateExample'
      responses:
        '200':
          description: Assignment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentBasicWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Assignments
      summary: Delete a specific assignment by ID
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Assignment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assignment deleted
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid assignment ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /assignments/{assignmentId}/submissions:
    get:
      tags:
        - Assignments
        - Submissions
      summary: Retrieve submissions for a specific assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of submissions for the assignment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionWithIds'
        '400':
          description: Bad request - Invalid assignment ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    post:
      tags:
        - Assignments
        - Submissions
      summary: Create a new submission for a specific assignment by a user
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionPost'
            examples:
              payload:
                $ref: '#/components/examples/AssignmentSubmissionPostExample'
      responses:
        '201':
          description: Submission created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionWithIds'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Assignment or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /submissions:
    get:
      tags:
        - Submissions
      summary: Retrieve a list of submissions
      responses:
        '200':
          description: A list of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionWithIds'
  /submissions/{submissionId}:
    get:
      tags:
        - Submissions
      summary: Retrieve a specific submission by ID
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionWithIds'
        '400':
          description: Bad request - Invalid submission ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'

  /grades:
    get:
      tags:
        - Grades
      summary: Retrieve a list of grades
      responses:
        '200':
          description: A list of grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeWithId'
  /grades/by-id/{gradeId}:
    get:
      tags:
        - Grades
      summary: Retrieve a specific grade by ID
      parameters:
        - name: gradeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeWithId'
        '400':
          description: Bad request - Invalid grade ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Grade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    put:
      tags:
        - Grades
      summary: Update a specific grade by ID
      parameters:
        - name: gradeId
          in: path
          required: true
          description: The ID of the grade to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradePatch'
            examples:
              payload:
                $ref: '#/components/examples/GradesUpdateExample'
      responses:
        '200':
          description: Grade updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeWithId'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Grade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      tags:
        - Grades
      summary: Delete a specific grade by ID
      parameters:
        - name: gradeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Grade deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Grade deleted
        '404':
          description: Grade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '400':
          description: Bad request - Invalid grade ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
  /grades/{userId}/{courseId}:
    get:
      tags:
        - Grades
        - Users
        - Courses
      summary: Retrieve all grades for a user in a specific course
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of grades for the user in the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeWithId'
        '400':
          description: Bad request - Invalid user ID or course ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
