components:
  schemas:
    UserId:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: Unique identifier for the user
    UserBasic:
      type: object
      required:
        - name
        - email
        - idNumber
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        profilePictureUrl:
          type: string
          format: uri
          description: URL to the user's profile picture
        idNumber:
          type: string
          description: Institution-specific ID number
    UserWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user
    UserGet:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserWithId'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user
            role:
              $ref: '#/components/schemas/RoleBasic'
            courses:
              type: array
              items:
                $ref: '#/components/schemas/CourseWithEnrolledDate'
    UserPost:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          required:
            - password
          properties:
            password:
              type: string
              format: password
              description: User's password (hashed in the database)

    RoleBasic:
      type: object
      properties:
        name:
          type: string
          description: Name of the role (e.g., Student, Instructor, Admin)

    CourseBasic:
      required:
        - name
        - courseCode
        - isOpen
        - startDate
      type: object
      properties:
        name:
          type: string
          description: Name of the course (e.g., Math 101)
        courseCode:
          type: string
          description: Course Code (e.g., MATH101)
        isOpen:
          type: boolean
          description: False value if the course is archived / not active
        description:
          type: string
          description: Description of the course
        startDate:
          type: string
          format: date
          description: Start date of the course
        endDate:
          type: string
          format: date
          description: End date of the course
    CourseBasicWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            courseId:
              type: string
              format: uuid
              description: Unique identifier for the course
    CoursePost:
      type: object
      required:
        - name
        - courseCode
        - userId
      allOf:
        - $ref: '#/components/schemas/CourseBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: ID of the instructor creating the course
    CourseWithEnrolledDate:
      type: object
      allOf:
        - $ref: '#/components/schemas/CourseBasicWithId'
        - type: object
          properties:
            enrolledOn:
              type: string
              format: date
              description: Date when the User started the course

    AssignmentBasic:
      type: object
      required:
        - name
        - description
        - dueDate
      properties:
        name:
          type: string
          description: Name of the assignment
        description:
          type: string
          description: Description of the assignment
        dueDate:
          type: string
          format: date-time
          description: Due date of the assignment
    AssignmentBasicWithCourseId:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssignmentBasic'
        - type: object
          properties:
            courseId:
              type: string
              format: uuid
              description: Unique identifier for the course
    AssignmentBasicWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssignmentBasicWithCourseId'
        - type: object
          properties:
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment
    AssignmentBasicWithAssignmentId:
      type: object
      allOf:
        - $ref: '#/components/schemas/AssignmentBasic'
        - type: object
          properties:
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment

    SubmissionBasic:
      type: object
      required:
        - comment
        - timeSubmitted
      properties:
        comment:
          type: string
          description: Comment or feedback for the submission
        timeSubmitted:
          type: string
          format: date-time
          description: Timestamp of when the submission was made
    SubmissionWithIds:
      type: object
      allOf:
        - $ref: '#/components/schemas/SubmissionBasic'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user who made the submission
            assignmentId:
              type: string
              format: uuid
              description: Unique identifier for the assignment
            assignmentSubmissionId:
              type: string
              format: uuid
              description: Unique identifier for the submission
    SubmissionPost:
      type: object
      allOf:
        - $ref: '#/components/schemas/SubmissionBasic'
        - type: object
          required:
            - userId
          properties:
            userId:
              type: string
              format: uuid
              description: Unique identifier for the user making the submission
            files:
              type: array
              items:
                type: string
                format: byte
                description: File data
            comment:
              type: string
              description: Comment or feedback for the submission

    GradeBasic:
      type: object
      required:
        - minScore
        - maxScore
        - weight
      properties:
        minScore:
          type: number
          description: Minimum possible score for the grade
        maxScore:
          type: number
          description: Maximum possible score for the grade
        achievedScore:
          type: number
          description: Achieved score (optional)
        weight:
          type: number
          description: Weight of this grade toward the course total
    GradeWithId:
      type: object
      allOf:
        - $ref: '#/components/schemas/GradeBasic'
        - type: object
          properties:
            gradeId:
              type: string
              format: uuid
              description: Unique identifier for the grade
            userId:
              type: string
              format: uuid
              description: ID of the user the grade belongs to
            courseId:
              type: string
              format: uuid
              description: ID of the course the grade belongs to
            assignmentSubmissionId:
              type: string
              format: uuid
              description: Optional assignment submission ID associated with the grade
    GradePatch:
      type: object
      properties:
        minScore:
          type: number
        maxScore:
          type: number
        achievedScore:
          type: number
        weight:
          type: number
    CalculatedGrade:
      type: object
      properties:
        grade:
          type: number
          format: float
          description: Calculated grade as a percentage (0-100)

    ContentBasic:
      type: object
      required:
        - name
        - viewable
      properties:
        name:
          type: string
        description:
          type: string
        viewable:
          type: boolean
        parentId:
          type: string
          description: Parent content ID (for sub-content)
        courseId:
          type: string
          description: Course ID associated with the content
    ContentPost:
      allOf:
        - $ref: '#/components/schemas/ContentBasic'
        - type: object
    ContentPatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        viewable:
          type: boolean
        parentId:
          type: string
    ContentGet:
      allOf:
        - $ref: '#/components/schemas/ContentBasic'
        - type: object
          properties:
            contentId:
              type: string
              format: uuid
            dateCreated:
              type: string
              format: date-time
            dateUpdated:
              type: string
              format: date-time

    BasicError:
      type: object
      properties:
        message:
          type: string
          description: Error message detailing what went wrong


  examples:
    CoursePostExample:
      summary: Example course creation payload
      value:
        name: "Data Structures"
        courseCode: "CS201"
        isOpen: true
        description: "An intermediate course on data structures."
