# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Testing in Jest Node.js

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build --if-present
      
    - name: Begin testing
      run: npm test

    - name: Publish test summary results
      uses: ctrf-io/github-test-reporter@v1
      with:
        report-path: ./src/Tests/ctrf-report.json
        github-report: true
        summary-report: true
        summary: true
        on-fail-only: true
        collapse-large-reports: true
      if: always()

    - name: Get coverage
      run: npx jest --coverage | tee ./src/Tests/coverage/coverage.txt && exit ${PIPESTATUS[0]}

    - name: Comment coverage report
      uses: MishaKav/jest-coverage-comment@main
      with:
        junitxml-title: Test Results
        junitxml-path: ./src/Tests/coverage/junit.xml
        coverage-title: Detailed Coverage Report
        coverage-path: ./src/Tests/coverage/coverage.txt
        title: "Code Coverage Report of Changed Files"
        coverage-summary-path: ./src/Tests/coverage/coverage-summary.json
        report-only-changed-files: true
