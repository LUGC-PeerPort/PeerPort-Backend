name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  eslint:
      name: Run ESLint
      runs-on: ubuntu-latest

      permissions:
        contents: read
        pull-requests: write

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "latest"
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Run ESLint
          run: npx eslint . -f json -o eslint-report.json

        - name: Upload ESLint report (artifact)
          uses: actions/upload-artifact@v4
          with:
            name: eslint-report
            path: eslint-report.json

        - name: Report ESLint issues on PR
          uses: reviewdog/action-eslint@v1
          with:
            reporter: github-pr-review # post as a PR review
            level: error               # treat ESLint errors as PR errors
            eslint_flags: ". --ext .ts,.tsx"
